<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg25"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#4f46e5"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#2563eb"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product25"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#4f46e5"/>

                <stop
                    offset="100%"
                    stop-color="#2563eb"/>
            </linearGradient>

            <filter
                id="shadow25"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg25)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#4f46e5"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="82"
            cy="54"
            r="29"
            fill="#4f46e5"
            opacity="0.10"/>

        <circle
            cx="542"
            cy="504"
            r="28"
            fill="#2563eb"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(189 185) rotate(-2 150 120) scale(0.9920714461260858)"
            filter="url(#shadow25)">

            
            <rect
                x="35"
                y="45"
                width="240"
                height="190"
                rx="25"
                fill="url(#product25)"/>

            <rect
                x="55"
                y="70"
                width="200"
                height="135"
                rx="12"
                fill="#111827"/>

            <circle
                cx="155"
                cy="137"
                r="28"
                fill="#2563eb"/>
        

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Camera

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #25

        </text>

    </svg>
    