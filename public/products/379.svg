<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg379"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#ea580c"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#ca8a04"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product379"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#ea580c"/>

                <stop
                    offset="100%"
                    stop-color="#ca8a04"/>
            </linearGradient>

            <filter
                id="shadow379"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg379)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#ea580c"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="90"
            cy="108"
            r="38"
            fill="#ea580c"
            opacity="0.10"/>

        <circle
            cx="513"
            cy="544"
            r="52"
            fill="#ca8a04"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(248 166) rotate(8 150 120) scale(1.0541321111937414)"
            filter="url(#shadow379)">

            
            <rect
                x="60"
                y="90"
                width="190"
                height="150"
                rx="35"
                fill="url(#product379)"/>

            <rect
                x="75"
                y="215"
                width="25"
                height="90"
                fill="#ca8a04"/>

            <rect
                x="210"
                y="215"
                width="25"
                height="90"
                fill="#ca8a04"/>
        

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Chair

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #379

        </text>

    </svg>
    