<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg32"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#2563eb"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#7c3aed"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product32"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#2563eb"/>

                <stop
                    offset="100%"
                    stop-color="#7c3aed"/>
            </linearGradient>

            <filter
                id="shadow32"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg32)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#2563eb"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="113"
            cy="53"
            r="43"
            fill="#2563eb"
            opacity="0.10"/>

        <circle
            cx="474"
            cy="462"
            r="35"
            fill="#7c3aed"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(188 189) rotate(-4 150 120) scale(1.1200641048799342)"
            filter="url(#shadow32)">

            
                <path
                    d="M55 160
                       C55 55 245 55 245 160
                       L245 245
                       L195 245
                       L195 155
                       C195 105 105 105 105 155
                       L105 245
                       L55 245 Z"
                    fill="url(#product32)"/>

                <rect
                    x="40"
                    y="205"
                    width="70"
                    height="95"
                    rx="25"
                    fill="#7c3aed"/>

                <rect
                    x="190"
                    y="205"
                    width="70"
                    height="95"
                    rx="25"
                    fill="#2563eb"/>
            

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Earbuds

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #32

        </text>

    </svg>
    