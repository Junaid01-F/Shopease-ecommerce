<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg306"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#dc2626"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#ca8a04"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product306"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#dc2626"/>

                <stop
                    offset="100%"
                    stop-color="#ca8a04"/>
            </linearGradient>

            <filter
                id="shadow306"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg306)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#dc2626"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="98"
            cy="121"
            r="21"
            fill="#dc2626"
            opacity="0.10"/>

        <circle
            cx="546"
            cy="527"
            r="26"
            fill="#ca8a04"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(247 184) rotate(0 150 120) scale(0.9126138435559678)"
            filter="url(#shadow306)">

            
            <rect
                x="60"
                y="90"
                width="190"
                height="150"
                rx="35"
                fill="url(#product306)"/>

            <rect
                x="75"
                y="215"
                width="25"
                height="90"
                fill="#ca8a04"/>

            <rect
                x="210"
                y="215"
                width="25"
                height="90"
                fill="#ca8a04"/>
        

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Sofa

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #306

        </text>

    </svg>
    