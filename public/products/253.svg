<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg253"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#65a30d"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#65a30d"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product253"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#65a30d"/>

                <stop
                    offset="100%"
                    stop-color="#65a30d"/>
            </linearGradient>

            <filter
                id="shadow253"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg253)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#65a30d"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="79"
            cy="58"
            r="34"
            fill="#65a30d"
            opacity="0.10"/>

        <circle
            cx="478"
            cy="468"
            r="33"
            fill="#65a30d"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(233 186) rotate(-4 150 120) scale(1.1442398152905284)"
            filter="url(#shadow253)">

            
            <path
                d="M75 55
                   L235 55
                   L255 250
                   L55 250 Z"
                fill="url(#product253)"/>

            <circle
                cx="155"
                cy="150"
                r="45"
                fill="#ffffff"
                opacity="0.8"/>
        

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Golf

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #253

        </text>

    </svg>
    