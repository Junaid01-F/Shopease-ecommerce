<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg130"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#c026d3"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#e11d48"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product130"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#c026d3"/>

                <stop
                    offset="100%"
                    stop-color="#e11d48"/>
            </linearGradient>

            <filter
                id="shadow130"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg130)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#c026d3"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="80"
            cy="124"
            r="30"
            fill="#c026d3"
            opacity="0.10"/>

        <circle
            cx="498"
            cy="493"
            r="46"
            fill="#e11d48"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(232 174) rotate(6 150 120) scale(0.8565810219012838)"
            filter="url(#shadow130)">

            
            <path
                d="M70 45
                   Q155 15 240 45
                   L260 285
                   L50 285 Z"
                fill="url(#product130)"/>

            <path
                d="M85 75 L225 75"
                stroke="#ffffff"
                stroke-width="8"
                opacity="0.7"/>
        

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Tshirt

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #130

        </text>

    </svg>
    