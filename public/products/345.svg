<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg345"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#b45309"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#ea580c"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product345"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#b45309"/>

                <stop
                    offset="100%"
                    stop-color="#ea580c"/>
            </linearGradient>

            <filter
                id="shadow345"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg345)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#b45309"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="69"
            cy="86"
            r="32"
            fill="#b45309"
            opacity="0.10"/>

        <circle
            cx="507"
            cy="456"
            r="46"
            fill="#ea580c"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(202 151) rotate(-3 150 120) scale(0.9065616712743403)"
            filter="url(#shadow345)">

            
            <ellipse
                cx="145"
                cy="145"
                rx="105"
                ry="75"
                fill="url(#product345)"/>

            <ellipse
                cx="145"
                cy="145"
                rx="70"
                ry="45"
                fill="#ffffff"
                opacity="0.35"/>

            <rect
                x="230"
                y="125"
                width="80"
                height="35"
                rx="17"
                fill="#ea580c"/>
        

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Pan

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #345

        </text>

    </svg>
    