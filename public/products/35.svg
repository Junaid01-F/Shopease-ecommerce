<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg35"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#0891b2"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#7c3aed"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product35"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#0891b2"/>

                <stop
                    offset="100%"
                    stop-color="#7c3aed"/>
            </linearGradient>

            <filter
                id="shadow35"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg35)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#0891b2"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="82"
            cy="122"
            r="21"
            fill="#0891b2"
            opacity="0.10"/>

        <circle
            cx="537"
            cy="546"
            r="52"
            fill="#7c3aed"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(169 163) rotate(2 150 120) scale(0.9795176371162514)"
            filter="url(#shadow35)">

            
                <rect
                    x="20"
                    y="75"
                    width="270"
                    height="135"
                    rx="22"
                    fill="url(#product35)"/>

                <g fill="#ffffff" opacity="0.8">
                    <rect x="45" y="100" width="28" height="20" rx="4"/>
                    <rect x="82" y="100" width="28" height="20" rx="4"/>
                    <rect x="119" y="100" width="28" height="20" rx="4"/>
                    <rect x="156" y="100" width="28" height="20" rx="4"/>
                    <rect x="193" y="100" width="28" height="20" rx="4"/>
                    <rect x="230" y="100" width="28" height="20" rx="4"/>

                    <rect x="65" y="140" width="180" height="20" rx="5"/>
                </g>
            

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Mouse

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #35

        </text>

    </svg>
    