<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg279"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#65a30d"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#0284c7"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product279"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#65a30d"/>

                <stop
                    offset="100%"
                    stop-color="#0284c7"/>
            </linearGradient>

            <filter
                id="shadow279"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg279)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#65a30d"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="93"
            cy="61"
            r="29"
            fill="#65a30d"
            opacity="0.10"/>

        <circle
            cx="543"
            cy="469"
            r="31"
            fill="#0284c7"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(212 156) rotate(-7 150 120) scale(1.1422968279990662)"
            filter="url(#shadow279)">

            
            <path
                d="M75 55
                   L235 55
                   L255 250
                   L55 250 Z"
                fill="url(#product279)"/>

            <circle
                cx="155"
                cy="150"
                r="45"
                fill="#ffffff"
                opacity="0.8"/>
        

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Golf

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #279

        </text>

    </svg>
    