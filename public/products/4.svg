<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg4"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#7c3aed"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#0891b2"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product4"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#7c3aed"/>

                <stop
                    offset="100%"
                    stop-color="#0891b2"/>
            </linearGradient>

            <filter
                id="shadow4"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg4)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#7c3aed"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="61"
            cy="58"
            r="20"
            fill="#7c3aed"
            opacity="0.10"/>

        <circle
            cx="521"
            cy="520"
            r="54"
            fill="#0891b2"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(242 170) rotate(-5 150 120) scale(0.9936635184771692)"
            filter="url(#shadow4)">

            
                <rect
                    x="105"
                    y="-20"
                    width="100"
                    height="320"
                    rx="45"
                    fill="#0891b2"/>

                <rect
                    x="60"
                    y="65"
                    width="190"
                    height="190"
                    rx="45"
                    fill="url(#product4)"/>

                <circle
                    cx="155"
                    cy="160"
                    r="65"
                    fill="#111827"/>

                <circle
                    cx="155"
                    cy="160"
                    r="10"
                    fill="#ffffff"/>
            

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Watch

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #4

        </text>

    </svg>
    