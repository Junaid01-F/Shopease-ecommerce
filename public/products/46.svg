<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg46"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#2563eb"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#4f46e5"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product46"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#2563eb"/>

                <stop
                    offset="100%"
                    stop-color="#4f46e5"/>
            </linearGradient>

            <filter
                id="shadow46"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg46)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#2563eb"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="79"
            cy="116"
            r="24"
            fill="#2563eb"
            opacity="0.10"/>

        <circle
            cx="544"
            cy="518"
            r="55"
            fill="#4f46e5"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(225 182) rotate(-7 150 120) scale(1.1079360020628284)"
            filter="url(#shadow46)">

            
                <path
                    d="M55 160
                       C55 55 245 55 245 160
                       L245 245
                       L195 245
                       L195 155
                       C195 105 105 105 105 155
                       L105 245
                       L55 245 Z"
                    fill="url(#product46)"/>

                <rect
                    x="40"
                    y="205"
                    width="70"
                    height="95"
                    rx="25"
                    fill="#4f46e5"/>

                <rect
                    x="190"
                    y="205"
                    width="70"
                    height="95"
                    rx="25"
                    fill="#2563eb"/>
            

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Headphones

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #46

        </text>

    </svg>
    