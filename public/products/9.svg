<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg9"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#4f46e5"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#0891b2"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product9"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#4f46e5"/>

                <stop
                    offset="100%"
                    stop-color="#0891b2"/>
            </linearGradient>

            <filter
                id="shadow9"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg9)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#4f46e5"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="50"
            cy="93"
            r="36"
            fill="#4f46e5"
            opacity="0.10"/>

        <circle
            cx="529"
            cy="527"
            r="27"
            fill="#0891b2"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(167 156) rotate(0 150 120) scale(1.1099685549959024)"
            filter="url(#shadow9)">

            
                <rect
                    x="65"
                    y="25"
                    width="180"
                    height="300"
                    rx="25"
                    fill="url(#product9)"/>

                <rect
                    x="80"
                    y="55"
                    width="150"
                    height="240"
                    rx="10"
                    fill="#111827"/>

                <circle
                    cx="155"
                    cy="310"
                    r="8"
                    fill="#ffffff"/>
            

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Phone

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #9

        </text>

    </svg>
    