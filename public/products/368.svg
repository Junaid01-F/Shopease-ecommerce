<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg368"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#dc2626"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#ea580c"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product368"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#dc2626"/>

                <stop
                    offset="100%"
                    stop-color="#ea580c"/>
            </linearGradient>

            <filter
                id="shadow368"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg368)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#dc2626"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="85"
            cy="67"
            r="30"
            fill="#dc2626"
            opacity="0.10"/>

        <circle
            cx="528"
            cy="499"
            r="28"
            fill="#ea580c"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(175 151) rotate(-7 150 120) scale(0.9927923760038282)"
            filter="url(#shadow368)">

            
            <circle
                cx="155"
                cy="150"
                r="105"
                fill="url(#product368)"/>

            <circle
                cx="155"
                cy="150"
                r="82"
                fill="#ffffff"/>

            <path
                d="M155 150 L155 90
                   M155 150 L205 175"
                stroke="#ea580c"
                stroke-width="10"
                stroke-linecap="round"/>
        

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Clock

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #368

        </text>

    </svg>
    