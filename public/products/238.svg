<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg238"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#0284c7"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#16a34a"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product238"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#0284c7"/>

                <stop
                    offset="100%"
                    stop-color="#16a34a"/>
            </linearGradient>

            <filter
                id="shadow238"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg238)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#0284c7"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="68"
            cy="71"
            r="23"
            fill="#0284c7"
            opacity="0.10"/>

        <circle
            cx="538"
            cy="521"
            r="43"
            fill="#16a34a"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(242 185) rotate(5 150 120) scale(0.8697154948594219)"
            filter="url(#shadow238)">

            
            <path
                d="M75 55
                   L235 55
                   L255 250
                   L55 250 Z"
                fill="url(#product238)"/>

            <circle
                cx="155"
                cy="150"
                r="45"
                fill="#ffffff"
                opacity="0.8"/>
        

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Helmet

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #238

        </text>

    </svg>
    