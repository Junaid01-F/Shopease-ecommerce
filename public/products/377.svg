<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg377"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#ca8a04"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#ea580c"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product377"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#ca8a04"/>

                <stop
                    offset="100%"
                    stop-color="#ea580c"/>
            </linearGradient>

            <filter
                id="shadow377"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg377)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#ca8a04"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="93"
            cy="113"
            r="40"
            fill="#ca8a04"
            opacity="0.10"/>

        <circle
            cx="492"
            cy="493"
            r="42"
            fill="#ea580c"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(160 146) rotate(-1 150 120) scale(0.9938464118053526)"
            filter="url(#shadow377)">

            
            <ellipse
                cx="145"
                cy="145"
                rx="105"
                ry="75"
                fill="url(#product377)"/>

            <ellipse
                cx="145"
                cy="145"
                rx="70"
                ry="45"
                fill="#ffffff"
                opacity="0.35"/>

            <rect
                x="230"
                y="125"
                width="80"
                height="35"
                rx="17"
                fill="#ea580c"/>
        

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Knife

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #377

        </text>

    </svg>
    