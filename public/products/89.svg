<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg89"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#2563eb"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#0891b2"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product89"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#2563eb"/>

                <stop
                    offset="100%"
                    stop-color="#0891b2"/>
            </linearGradient>

            <filter
                id="shadow89"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg89)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#2563eb"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="103"
            cy="92"
            r="26"
            fill="#2563eb"
            opacity="0.10"/>

        <circle
            cx="508"
            cy="538"
            r="46"
            fill="#0891b2"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(194 149) rotate(-4 150 120) scale(0.8948718231478153)"
            filter="url(#shadow89)">

            
            <rect
                x="35"
                y="45"
                width="240"
                height="190"
                rx="25"
                fill="url(#product89)"/>

            <rect
                x="55"
                y="70"
                width="200"
                height="135"
                rx="12"
                fill="#111827"/>

            <circle
                cx="155"
                cy="137"
                r="28"
                fill="#0891b2"/>
        

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Router

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #89

        </text>

    </svg>
    