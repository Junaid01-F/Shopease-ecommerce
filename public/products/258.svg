<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg258"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#16a34a"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#059669"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product258"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#16a34a"/>

                <stop
                    offset="100%"
                    stop-color="#059669"/>
            </linearGradient>

            <filter
                id="shadow258"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg258)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#16a34a"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="50"
            cy="98"
            r="31"
            fill="#16a34a"
            opacity="0.10"/>

        <circle
            cx="497"
            cy="524"
            r="34"
            fill="#059669"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(175 153) rotate(5 150 120) scale(1.0507581261448453)"
            filter="url(#shadow258)">

            
                <ellipse
                    cx="145"
                    cy="110"
                    rx="80"
                    ry="105"
                    fill="none"
                    stroke="url(#product258)"
                    stroke-width="24"/>

                <path
                    d="M145 210 L205 300"
                    stroke="#059669"
                    stroke-width="28"
                    stroke-linecap="round"/>

                <path
                    d="M95 60 L195 160
                       M195 60 L95 160"
                    stroke="#ffffff"
                    stroke-width="4"
                    opacity="0.5"/>
            

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Racket

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #258

        </text>

    </svg>
    