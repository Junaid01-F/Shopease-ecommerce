<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg155"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#e11d48"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#c026d3"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product155"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#e11d48"/>

                <stop
                    offset="100%"
                    stop-color="#c026d3"/>
            </linearGradient>

            <filter
                id="shadow155"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg155)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#e11d48"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="57"
            cy="123"
            r="20"
            fill="#e11d48"
            opacity="0.10"/>

        <circle
            cx="537"
            cy="461"
            r="30"
            fill="#c026d3"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(224 162) rotate(5 150 120) scale(1.0903284852031085)"
            filter="url(#shadow155)">

            
            <path
                d="M70 45
                   Q155 15 240 45
                   L260 285
                   L50 285 Z"
                fill="url(#product155)"/>

            <path
                d="M85 75 L225 75"
                stroke="#ffffff"
                stroke-width="8"
                opacity="0.7"/>
        

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Wallet

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #155

        </text>

    </svg>
    