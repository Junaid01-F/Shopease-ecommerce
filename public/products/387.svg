<svg
        xmlns="http://www.w3.org/2000/svg"
        width="600"
        height="600"
        viewBox="0 0 600 600">

        <defs>
            <linearGradient
                id="bg387"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#dc2626"
                    stop-opacity="0.15"/>

                <stop
                    offset="100%"
                    stop-color="#ca8a04"
                    stop-opacity="0.05"/>
            </linearGradient>

            <linearGradient
                id="product387"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop
                    offset="0%"
                    stop-color="#dc2626"/>

                <stop
                    offset="100%"
                    stop-color="#ca8a04"/>
            </linearGradient>

            <filter
                id="shadow387"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%">

                <feDropShadow
                    dx="0"
                    dy="18"
                    stdDeviation="18"
                    flood-opacity="0.18"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect
            width="600"
            height="600"
            fill="url(#bg387)"/>

        <circle
            cx="300"
            cy="300"
            r="210"
            fill="#dc2626"
            opacity="0.04"/>

        <!-- Decorative circles -->
        <circle
            cx="74"
            cy="97"
            r="28"
            fill="#dc2626"
            opacity="0.10"/>

        <circle
            cx="534"
            cy="464"
            r="44"
            fill="#ca8a04"
            opacity="0.10"/>

        <!-- Product -->
        <g
            transform="translate(250 156) rotate(-7 150 120) scale(1.0883240011646313)"
            filter="url(#shadow387)">

            
        <rect
            x="50"
            y="55"
            width="210"
            height="220"
            rx="25"
            fill="url(#product387)"/>

        <rect
            x="75"
            y="80"
            width="160"
            height="120"
            rx="12"
            fill="#ffffff"
            opacity="0.45"/>

        <circle
            cx="155"
            cy="235"
            r="18"
            fill="#ca8a04"/>
    

        </g>

        <!-- Product category -->
        <text
            x="300"
            y="505"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="22"
            font-weight="700"
            fill="#111827">

            Carpet

        </text>

        <!-- Product ID -->
        <text
            x="300"
            y="540"
            text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="15"
            fill="#6b7280">

            ShopEase Product #387

        </text>

    </svg>
    